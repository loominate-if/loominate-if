<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" width="1520" height="1176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5">
  <title>Loominate roadmap</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b5b3aa"/>
    </marker>
  </defs>
  <rect width="760" height="588" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Each phase ends at a gate: a game that must pass before the next begins</text>

  <!-- Connectors -->
  <g fill="none" stroke="#b5b3aa" stroke-width="1.25">
    <path d="M56 124V136"/><path d="M56 160V170" marker-end="url(#arrow)"/>
    <path d="M56 244V256"/><path d="M56 280V290" marker-end="url(#arrow)"/>
    <path d="M56 364V376"/><path d="M56 400V410" marker-end="url(#arrow)"/>
    <path d="M56 484V506" marker-end="url(#arrow)"/>
  </g>

  <!-- Phase 1 (current) -->
  <rect x="24" y="52" width="712" height="72" rx="8" fill="#2f74d0" fill-opacity="0.12" stroke="#2f74d0" stroke-width="2"/>
  <text x="40" y="76" font-size="13" font-weight="600" fill="#1f1f1f">Phase 1 · Core and tooling</text>
  <text x="40" y="92" fill="#1f1f1f">Core runtime, passage compiler with stable line IDs, inline code with effect phases, page layout, beats</text>
  <text x="40" y="108" fill="#1f1f1f">Inspector, walkthrough tests, CLI with dev server, static-site and single-file builds</text>

  <polygon points="44,148 56,136 68,148 56,160" fill="#efeeea" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="80" y="152" fill="#5c5c5c">Gate: a plain branching story builds, plays, saves, undoes, and passes its walkthrough test</text>

  <!-- Phase 2 -->
  <rect x="24" y="172" width="712" height="72" rx="8" fill="none" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="40" y="196" font-size="13" font-weight="600" fill="#1f1f1f">Phase 2 · World model</text>
  <text x="40" y="212" fill="#5c5c5c">Objects, rooms and exits, context menus, compass, minds and bodies, stats, traits, relationships</text>
  <text x="40" y="228" fill="#5c5c5c">Knowledge, scenes, storylets, clock and calendar, fuses and daemons, stacks, save migration</text>

  <polygon points="44,268 56,256 68,268 56,280" fill="#efeeea" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="80" y="272" fill="#5c5c5c">Gate: the world-model acceptance game (container, locked door, NPC with topics) passes</text>

  <!-- Phase 3 -->
  <rect x="24" y="292" width="712" height="72" rx="8" fill="none" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="40" y="316" font-size="13" font-weight="600" fill="#1f1f1f">Phase 3 · Characters and story</text>
  <text x="40" y="332" fill="#5c5c5c">Observed and scheduled NPCs, agendas, companions that follow, one-on-one conversations, conversation mode</text>
  <text x="40" y="348" fill="#5c5c5c">Story log and transcript views with export, autocomplete command line, shareable seeds</text>

  <polygon points="44,388 56,376 68,388 56,400" fill="#efeeea" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="80" y="392" fill="#5c5c5c">Gate: a conversation-driven demo passes with no unreachable topics in its coverage report</text>

  <!-- Phase 4 -->
  <rect x="24" y="412" width="712" height="72" rx="8" fill="none" stroke="#b5b3aa" stroke-width="1.25"/>
  <text x="40" y="436" font-size="13" font-weight="600" fill="#1f1f1f">Phase 4 · Depth and reach</text>
  <text x="40" y="452" fill="#5c5c5c">Simulated NPCs, independent companions, group conversations, audio, editor extension, story map</text>
  <text x="40" y="468" fill="#5c5c5c">Archive format with generic player and sandbox, desktop and mobile builds</text>

  <!-- Later -->
  <rect x="24" y="508" width="712" height="56" rx="8" fill="none" stroke="#b5b3aa" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="40" y="532" font-size="13" font-weight="600" fill="#1f1f1f">Later · Optional packages</text>
  <text x="40" y="548" fill="#5c5c5c">RPG, procedural generation, visual novel, and life-sim kits; full parser, Twee 3 import, more languages</text>
</svg>
