name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor in package.json, and the current LTS.
        node: ["22.18", "lts/*"]
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so scripts/editors.test.ts can check the Zed extension's grammar commit (#411).
          fetch-depth: 0
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The acceptance games: nothing they can't reach (#133).
      - run: pnpm coverage
      - run: pnpm api

  # The single check to require in branch protection, so changing the matrix
  # never leaves a required check that no longer reports.
  ci:
    name: CI
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - if: needs.check.result != 'success'
        run: exit 1
